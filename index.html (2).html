<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070818" />
  <title>宇宙をめぐる惑星ラリー</title>
  <style>
    :root{--bg:#050510;--panel:rgba(15,18,48,.80);--cyan:#55e6ff;--purple:#9b77ff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 50% -10%,#312e81 0,#0b1026 38%,#050510 78%);overflow-x:hidden}
    .stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 37px;opacity:.45}.stars:before{background-size:71px 71px;transform:translate(12px,18px);opacity:.35}.stars:after{background-size:113px 113px;transform:translate(31px,6px);opacity:.6}
    main{position:relative;z-index:1;max-width:980px;margin:auto;padding:24px 14px 48px}.tag{display:inline-flex;padding:8px 14px;border:1px solid #67e8f955;border-radius:999px;background:#22d3ee18;color:#b6f3ff;font-size:12px;font-weight:900;letter-spacing:.15em}header{text-align:center}h1{margin:12px 0 5px;font-size:clamp(29px,7vw,52px);line-height:1.1;background:linear-gradient(90deg,#67e8f9,#fff,#f0abfc);color:transparent;background-clip:text}header p{color:#cbd5e1;line-height:1.8;font-size:14px}
    .progress{max-width:650px;margin:20px auto;padding:17px;border:1px solid #ffffff1f;border-radius:24px;background:#ffffff0d;backdrop-filter:blur(12px)}.prow{display:flex;justify-content:space-between;align-items:center}.label{font-size:11px;color:#94a3b8;font-weight:800;letter-spacing:.1em}.count{font-size:27px;font-weight:900}.count span{color:var(--cyan)}.stamps{display:flex;gap:8px}.stamp{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff22;color:#64748b;background:#ffffff09;font-weight:900}.stamp.on{color:#06121c;background:#39d9f4;border-color:#bcf7ff;box-shadow:0 0 18px #22d3ee}.bar{height:8px;margin-top:12px;border-radius:99px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#e879f9);transition:.45s}.status{text-align:center;margin:9px 0 0;color:#cbd5e1;font-size:12px;font-weight:700}
    .space{position:relative;height:570px;margin:20px auto 0;border:1px solid #818cf833;border-radius:30px;background:radial-gradient(circle at center,#6d28d924,transparent 48%);overflow:hidden;box-shadow:inset 0 0 70px #4f46e52b}.planetBtn{position:absolute;transform:translate(-50%,-50%);border:0;background:none;color:white;padding:0;cursor:pointer;animation:float 3.6s ease-in-out infinite}.planetBtn:nth-child(even){animation-delay:-1.3s}.planetBtn:disabled{cursor:default}.planet{position:relative;display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2));box-shadow:0 0 28px #818cf977;transition:.25s;overflow:hidden}.planet:before,.planet:after{content:"";position:absolute;width:130%;height:12%;left:-15%;top:28%;border-radius:50%;background:#ffffff26;transform:rotate(-10deg)}.planet:after{top:63%;height:9%;background:#0002;transform:rotate(7deg)}.planetBtn:not(:disabled):active .planet{scale:.94}.pname{position:relative;z-index:2;max-width:88%;font-weight:900;font-size:14px;text-shadow:0 2px 4px #000}.tap{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;padding:4px 8px;border-radius:99px;background:#000a;border:1px solid #ffffff1c;font-size:10px;font-weight:800}.planetBtn.done .planet{--c1:#a7f3d0!important;--c2:#059669!important;border-color:#d1fae5;box-shadow:0 0 35px #34d399}.ring{position:absolute;z-index:-1;left:50%;top:50%;width:145%;height:38%;transform:translate(-50%,-50%) rotate(18deg);border:9px solid #fde68aaa;border-radius:50%;box-shadow:0 0 14px #fbbf2488}
    .reset{display:block;margin:18px auto 0;border:0;background:transparent;color:#64748b;padding:10px 16px;font-weight:700}.modal{position:fixed;z-index:10;inset:0;display:none;align-items:flex-end;justify-content:center;background:#000b;backdrop-filter:blur(8px)}.modal.open{display:flex}.sheet{width:100%;max-width:440px;padding:25px;background:#10142d;border:1px solid #ffffff22;border-radius:30px 30px 0 0;box-shadow:0 -20px 60px #0008}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;background:#ffffff0b;color:#aaa;font-size:22px}.key{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#22d3ee,#7c3aed);font-size:27px}.sheet h2{clear:both;margin:17px 0 5px;font-size:25px}.sheet p{color:#cbd5e1;line-height:1.6;font-size:14px}.sheet input{width:100%;height:56px;border:1px solid #ffffff25;border-radius:17px;background:#ffffff0e;color:#fff;text-align:center;font-size:18px;font-weight:900;text-transform:uppercase;outline:0}.sheet input:focus{border-color:#67e8f9}.error{min-height:20px!important;color:#fb7185!important;font-weight:800}.submit,.back{width:100%;border:0;border-radius:17px;padding:15px;font-weight:900;font-size:15px}.submit{color:#fff;background:linear-gradient(90deg,#06b6d4,#7c3aed)}
    .complete{align-items:center;padding:18px}.complete .sheet{text-align:center;border-radius:30px;background:linear-gradient(#1e1b4b,#080b1d)}.trophy{display:grid;place-items:center;width:95px;height:95px;margin:auto;border-radius:50%;font-size:48px;background:linear-gradient(135deg,#fde047,#f97316);box-shadow:0 0 40px #f59e0b}.complete h2{font-size:38px;margin:13px}.back{background:white;color:#0f172a;margin-top:12px}@keyframes float{50%{transform:translate(-50%,calc(-50% - 8px))}}
    @media(min-width:640px){.modal{align-items:center}.sheet{border-radius:30px}.space{height:630px}.pname{font-size:16px}}
  </style>
</head>
<body><div class="stars"></div><main>
<header><span class="tag">✦ PLANET STAMP RALLY</span><h1>宇宙をめぐる惑星ラリー</h1><p>好きな惑星をタップして、ブースのパスワードを入力しよう。<br><b>6つのうち3つ</b>を巡ると活動完了！</p></header>
<section class="progress"><div class="prow"><div><div class="label">MISSION PROGRESS</div><div class="count"><span id="count">0</span> / 3</div></div><div class="stamps"><b class="stamp">1</b><b class="stamp">2</b><b class="stamp">3</b></div></div><div class="bar"><i id="bar"></i></div><p class="status" id="status">あと3つの惑星で活動完了</p></section>
<section class="space" id="space"></section><button class="reset" id="reset">↻ 最初からやり直す</button>
</main>
<div class="modal" id="passwordModal"><div class="sheet"><button class="close" data-close>×</button><div class="key">🔑</div><h2 id="modalTitle"></h2><p>ブースで教えてもらったパスワードを入力してください。</p><form id="form"><input id="password" autocomplete="off" placeholder="パスワードを入力"><p class="error" id="error"></p><button class="submit">この惑星をクリアする</button></form></div></div>
<div class="modal complete" id="completeModal"><div class="sheet"><div class="trophy">🏆</div><div class="label" style="color:#fde047;margin-top:20px">MISSION COMPLETE</div><h2>活動完了！</h2><p>3つの惑星を巡りました。<br>この画面を受付のスタッフに見せてください。</p><button class="back" data-close>惑星マップに戻る</button></div></div>
<script>
const planets=[
{id:1,name:'natus星',password:'3847',c1:'#22d3ee',c2:'#2563eb',size:126,x:18,y:23},
{id:2,name:'re/smile星',password:'1965',c1:'#bef264',c2:'#65a30d',size:98,x:51,y:17,ring:true},
{id:3,name:'TRUSS星',password:'9052',c1:'#fb7185',c2:'#dc2626',size:102,x:35,y:56},
{id:4,name:'まちみらい星',password:'6714',c1:'#c084fc',c2:'#4338ca',size:122,x:61,y:49},
{id:5,name:'たべっこ星',password:'7403',c1:'#fbbf24',c2:'#ea580c',size:106,x:82,y:20,ring:true},
{id:6,name:'拾人星',password:'2589',c1:'#f9a8d4',c2:'#7c3aed',size:112,x:84,y:60,ring:true}
];
const KEY='planet-rally-progress-v1';let cleared=[];let selected=null;
try{cleared=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){cleared=[]}
const space=document.querySelector('#space'),pm=document.querySelector('#passwordModal'),cm=document.querySelector('#completeModal');
function render(){space.innerHTML='';planets.forEach(p=>{const done=cleared.includes(p.id),b=document.createElement('button');b.className='planetBtn'+(done?' done':'');b.style.left=p.x+'%';b.style.top=p.y+'%';b.disabled=done;b.innerHTML=`<div style="position:relative;width:${p.size}px;height:${p.size}px;--s:${p.size}px;--c1:${p.c1};--c2:${p.c2}">${p.ring?'<i class="ring"></i>':''}<div class="planet"><span class="pname">${done?'✓ CLEAR!':p.name}</span></div>${done?'':'<span class="tap">🔒 タップ</span>'}</div>`;b.onclick=()=>openPlanet(p);space.appendChild(b)});const n=Math.min(cleared.length,3);document.querySelector('#count').textContent=n;document.querySelector('#bar').style.width=(n/3*100)+'%';document.querySelectorAll('.stamp').forEach((s,i)=>s.classList.toggle('on',i<n));document.querySelector('#status').textContent=n>=3?'ミッション達成！受付でこの画面を見せてね':`あと${3-n}つの惑星で活動完了`;localStorage.setItem(KEY,JSON.stringify(cleared))}
function openPlanet(p){selected=p;document.querySelector('#modalTitle').textContent=p.name+'に到着！';document.querySelector('#password').value='';document.querySelector('#error').textContent='';pm.classList.add('open');setTimeout(()=>document.querySelector('#password').focus(),100)}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const v=document.querySelector('#password').value.trim().toUpperCase();if(v!==selected.password){document.querySelector('#error').textContent='パスワードが違います。ブースで確認してみよう！';return}const was=cleared.length;cleared=[...new Set([...cleared,selected.id])];pm.classList.remove('open');render();if(was<3&&cleared.length>=3)cm.classList.add('open')};
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.modal').classList.remove('open'));document.querySelector('#reset').onclick=()=>{if(confirm('集めたスタンプをすべてリセットしますか？')){cleared=[];localStorage.removeItem(KEY);render()}};render();
</script></body></html>
